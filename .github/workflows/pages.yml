name: Deploy Penmanship Pad to GitHub Pages

on:
  push:
    branches: [main]
  # Pushes made by a workflow don't start other workflows, so deploy again after new recordings.
  workflow_run:
    workflows: ["Fetch Lingua Libre recordings"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Upload in one job and deploy in another (GitHub's recommended layout): the deploy only
  # starts once the upload has fully finished, so it can always find it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
